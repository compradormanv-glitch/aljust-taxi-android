<!DOCTYPE html>

<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Al.just Táxi</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    .account-card{
      background:#fff;
      border-radius:20px;
      margin:0 14px 16px;
      padding:20px;
      box-shadow:0 5px 22px #0000000d;
      max-width:732px;
      margin-left:auto;
      margin-right:auto;
    }

    .account-title{
      font-size:25px;
      font-weight:800;
      color:#172033;
      margin:0 0 6px;
    }

    .account-subtitle{
      color:#697386;
      font-size:14px;
      margin:0 0 22px;
    }

    .settings-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:15px 0;
      border-bottom:1px solid #edf0f4;
    }

    .settings-item:last-child{
      border-bottom:0;
    }

    .settings-left{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .settings-icon{
      width:42px;
      height:42px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#eef4fb;
      border-radius:12px;
      font-size:20px;
    }

    .settings-text strong{
      display:block;
      font-size:15px;
      color:#172033;
    }

    .settings-text small{
      display:block;
      color:#7a8494;
      font-size:12px;
      margin-top:3px;
    }

    .save-account{
      width:100%;
      height:50px;
      border:0;
      border-radius:13px;
      background:#e5232b;
      color:#fff;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }

    .account-message{
      min-height:20px;
      text-align:center;
      color:#173d72;
      font-size:13px;
      margin:10px 0;
    }

    .back-home{
      width:100%;
      margin-top:10px;
      height:48px;
      border:1px solid #dfe4eb;
      border-radius:13px;
      background:#fff;
      color:#173d72;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    .switch{
      position:relative;
      display:block;
      width:50px;
      height:28px;
    }

    .switch input{
      display:none;
    }

    .slider{
      position:absolute;
      inset:0;
      background:#ccd3dc;
      border-radius:30px;
      cursor:pointer;
    }

    .slider:before{
      content:"";
      position:absolute;
      width:22px;
      height:22px;
      left:3px;
      top:3px;
      background:#fff;
      border-radius:50%;
      transition:.2s;
    }

    .switch input:checked + .slider{
      background:#173d72;
    }

    .switch input:checked + .slider:before{
      transform:translateX(22px);
    }
  </style>

</head>

<body>

<header class="topbar">
  <div class="logo">
    AL<span>.just</span><small> Táxi</small>
  </div>

  <button id="modeBtn" class="mode-btn">
    👨🏽‍✈️ Motorista
  </button>
</header>

<main>

  <!-- CLIENTE -->

  <section id="customerHome">

```
<section class="hero">
  <p class="small">AL.JUST TÁXI</p>

  <h1 id="pageTitle">
    Pedir uma corrida
  </h1>

  <p id="pageSubtitle" class="muted">
    Escolha o local de partida e o destino.
  </p>
</section>


<section id="customerPanel" class="card">

  <label>👤 Seu nome</label>

  <input
    id="customerName"
    type="text"
    placeholder="Ex.: Alberto"
  >


  <label>📍 Local de partida</label>

  <input
    id="pickupText"
    type="text"
    placeholder="Clique em Minha localização"
  >


  <label>🎯 Destino</label>

  <input
    id="destinationText"
    type="text"
    placeholder="Toque no mapa para marcar"
  >


  <div class="map-wrap">

    <div id="map"></div>

    <button
      id="locationBtn"
      class="map-locate"
      type="button"
    >
      📍 Minha localização
    </button>

  </div>


  <p class="hint">
    Use o GPS para definir a partida e toque no mapa para escolher o destino.
  </p>


  <div class="row">

    <div>
      <label>👥 Passageiros</label>

      <select id="passengers">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
    </div>


    <div>
      <label>🚕 Tipo de táxi</label>

      <select id="carType">
        <option value="normal">Al.just Normal</option>
        <option value="confort">Al.just Confort</option>
      </select>
    </div>

  </div>


  <div class="estimate">

    <div>
      <span>Distância</span>
      <strong id="distance">-- km</strong>
    </div>

    <div class="right">
      <span>Estimativa</span>
      <strong id="price">-- Kz</strong>
    </div>

  </div>


  <button
    id="requestBtn"
    class="primary"
    type="button"
  >
    🚕 Pedir táxi
  </button>


  <div
    id="rideStatus"
    class="status-box hidden"
  ></div>


  <div
    id="driverCard"
    class="driver-live hidden"
  ></div>


  <p
    id="customerMessage"
    class="message"
  ></p>

</section>
```

  </section>

  <!-- MOTORISTA -->

  <section
    id="driverPanel"
    class="card hidden"
  >

```
<div class="section-title">

  <h2>Painel do motorista</h2>

  <span
    id="driverConnection"
    class="offline"
  >
    ● offline
  </span>

</div>


<label>👨🏽‍✈️ Nome do motorista</label>

<input
  id="driverName"
  type="text"
  placeholder="Ex.: João"
>


<label>📞 Telefone</label>

<input
  id="driverPhone"
  type="tel"
  placeholder="Ex.: 926 000 000"
>


<div class="row">

  <div>
    <label>🚘 Viatura</label>

    <input
      id="driverCar"
      type="text"
      placeholder="Ex.: Suzuki"
    >
  </div>


  <div>
    <label>🔢 Matrícula</label>

    <input
      id="driverPlate"
      type="text"
      placeholder="Ex.: LD-00-00-AA"
    >
  </div>

</div>


<button
  id="driverOnlineBtn"
  class="primary secondary"
  type="button"
>
  🟢 Ficar online
</button>


<div
  id="activeRide"
  class="status-box hidden"
></div>


<div
  id="driverRequests"
  class="requests"
>
  <div class="empty">
    Entre online para receber pedidos dos clientes.
  </div>
</div>


<p
  id="driverMessage"
  class="message"
></p>
```

  </section>

  <!-- CONTA / CONFIGURAÇÕES -->

  <section
    id="accountPanel"
    class="account-card hidden"
  >

```
<h2 class="account-title">
  ⚙️ Configurações
</h2>

<p class="account-subtitle">
  Gerencie os seus dados e preferências do Al.just Táxi.
</p>


<label>👤 Seu nome</label>

<input
  id="accountName"
  type="text"
  placeholder="Digite o seu nome"
>


<label>📞 Seu telefone</label>

<input
  id="accountPhone"
  type="tel"
  placeholder="Ex.: 926 163 681"
>


<button
  id="saveAccountBtn"
  class="save-account"
  type="button"
>
  💾 Guardar dados
</button>


<p
  id="accountMessage"
  class="account-message"
></p>


<div class="settings-item">

  <div class="settings-left">

    <div class="settings-icon">
      🔔
    </div>

    <div class="settings-text">

      <strong>Notificações</strong>

      <small>
        Receber avisos sobre corridas
      </small>

    </div>

  </div>


  <label class="switch">

    <input
      id="notificationsToggle"
      type="checkbox"
      checked
    >

    <span class="slider"></span>

  </label>

</div>


<div class="settings-item">

  <div class="settings-left">

    <div class="settings-icon">
      📱
    </div>

    <div class="settings-text">

      <strong>Aplicação</strong>

      <small>
        Al.just Táxi
      </small>

    </div>

  </div>

  <span style="color:#7a8494;font-size:13px;">
    v1.0
  </span>

</div>


<div class="settings-item">

  <div class="settings-left">

    <div class="settings-icon">
      🏢
    </div>

    <div class="settings-text">

      <strong>Empresa</strong>

      <small>
        Al.just Táxi — Angola
      </small>

    </div>

  </div>

</div>


<button
  id="backHomeBtn"
  class="back-home"
  type="button"
>
  ← Voltar para início
</button>
```

  </section>

</main>

<!-- MENU INFERIOR -->

<nav class="bottom-nav">

<button
id="bottomHome"
class="active"
type="button"

>

