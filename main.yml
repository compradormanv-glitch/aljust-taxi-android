name: Build Al.just Táxi APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Criar projeto Android
        shell: bash
        run: |
          set -e

          rm -rf app

          mkdir -p app/src/main/java/ao/aljust/taxi
          mkdir -p app/src/main/assets

          for file in index.html style.css app.js config.js manifest.json sw.js icon-192.png icon-512.png; do
            if [ -f "$file" ]; then
              cp "$file" "app/src/main/assets/$file"
            fi
          done

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AljustTaxiAndroid"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.0" apply false
          }
          EOF

          cat > app/build.gradle.kts <<EOF
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "ao.aljust.taxi"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ao.aljust.taxi"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = ${GITHUB_RUN_NUMBER}
                  versionName = "1.0.${GITHUB_RUN_NUMBER}"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }

                  release {
                      isMinifyEnabled = false
                  }
              }
          }

          dependencies {
              implementation("androidx.webkit:webkit:1.17.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:label="Al.just Táxi"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/ao/aljust/taxi/MainActivity.java <<'EOF'
          package ao.aljust.taxi;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.loadUrl("file:///android_asset/index.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "Tamanho do APK:"
          ls -lh "$APK"

          echo "Verificando ZIP/APK:"
          unzip -t "$APK" >/dev/null

          echo "Verificando pacote Android:"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort | tail -1)
          "$AAPT2" dump badging "$APK" | head -20

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Al.just-Taxi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
