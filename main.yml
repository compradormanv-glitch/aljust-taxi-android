  </button>

<button
id="bottomMode"
type="button"

>

```
👨🏽‍✈️
```

```
<span>Motorista</span>
```

  </button>

<button
id="bottomAccount"
type="button"

>

```
⚙️
```

```
<span>Conta</span>
```

  </button>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="config.js"></script>

<script src="app.js"></script>

<script>

const accountPanel =
  document.getElementById("accountPanel");

const customerHome =
  document.getElementById("customerHome");

const driverPanel =
  document.getElementById("driverPanel");

const bottomHome =
  document.getElementById("bottomHome");

const bottomMode =
  document.getElementById("bottomMode");

const bottomAccount =
  document.getElementById("bottomAccount");

const backHomeBtn =
  document.getElementById("backHomeBtn");

const saveAccountBtn =
  document.getElementById("saveAccountBtn");

const accountName =
  document.getElementById("accountName");

const accountPhone =
  document.getElementById("accountPhone");

const accountMessage =
  document.getElementById("accountMessage");

const customerName =
  document.getElementById("customerName");


function showAccount(){

  customerHome.classList.add("hidden");

  driverPanel.classList.add("hidden");

  accountPanel.classList.remove("hidden");

  bottomHome.classList.remove("active");

  bottomMode.classList.remove("active");

  bottomAccount.classList.add("active");

}


function showHome(){

  accountPanel.classList.add("hidden");

  driverPanel.classList.add("hidden");

  customerHome.classList.remove("hidden");

  bottomHome.classList.add("active");

  bottomMode.classList.remove("active");

  bottomAccount.classList.remove("active");

  setTimeout(function(){

    if(typeof map !== "undefined" && map){
      map.invalidateSize();
    }

  },150);

}


function showDriver(){

  accountPanel.classList.add("hidden");

  customerHome.classList.add("hidden");

  driverPanel.classList.remove("hidden");

  bottomHome.classList.remove("active");

  bottomMode.classList.add("active");

  bottomAccount.classList.remove("active");

}


function loadAccount(){

  accountName.value =
    localStorage.getItem("aljust_customer_name") || "";

  accountPhone.value =
    localStorage.getItem("aljust_customer_phone") || "";

}


bottomAccount.addEventListener(
  "click",
  showAccount
);


bottomHome.addEventListener(
  "click",
  function(){

    showHome();

    if(typeof setMode === "function"){
      setMode("customer");
    }

  }
);


bottomMode.addEventListener(
  "click",
  function(){

    showDriver();

    if(typeof setMode === "function"){
      setMode("driver");
    }

  }
);


backHomeBtn.addEventListener(
  "click",
  function(){

    showHome();

    if(typeof setMode === "function"){
      setMode("customer");
    }

  }
);


saveAccountBtn.addEventListener(
  "click",
  function(){

    const name =
      accountName.value.trim();

    const phone =
      accountPhone.value.trim();

    localStorage.setItem(
      "aljust_customer_name",
      name
    );

    localStorage.setItem(
      "aljust_customer_phone",
      phone
    );

    if(customerName){
      customerName.value = name;
    }

    accountMessage.textContent =
      "✅ Dados guardados com sucesso.";

  }
);


loadAccount();


const savedCustomerName =
  localStorage.getItem("aljust_customer_name");


if(savedCustomerName && customerName){

  customerName.value =
    savedCustomerName;

}

</script>

</body>
</html>

